# Local development stack. Start with: docker compose -f infra/docker-compose.yml up --build
# Web: http://localhost:3000 · API: http://localhost:8000/docs · S3: http://localhost:8333
name: freerec

x-backend: &backend
  build: ../services/backend
  environment: &backend-env
    FREEREC_REDIS_URL: redis://redis:6379/0
    FREEREC_S3_ENDPOINT: http://s3:8333
    FREEREC_S3_PUBLIC_ENDPOINT: http://localhost:8333
    FREEREC_S3_BUCKET: freerec
    FREEREC_S3_ACCESS_KEY: freerec
    FREEREC_S3_SECRET_KEY: freerec-dev-secret
    FREEREC_CORS_ORIGINS: '["http://localhost:3000"]'
    FREEREC_ENABLE_DEBUG_OPS: "true"
  depends_on:
    redis:
      condition: service_healthy
    storage-setup:
      condition: service_completed_successfully
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]

services:
  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 15

  # S3-compatible storage for development (R2 or S3 in production).
  s3:
    image: chrislusf/seaweedfs:4.47
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    volumes:
      - ./seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
    ports: ["8333:8333"]

  storage-setup:
    build: ../services/backend
    command: python -m freerec.setup_storage
    environment: *backend-env
    depends_on: [s3]
    restart: on-failure

  api:
    <<: *backend
    ports: ["8000:8000"]

  worker:
    <<: *backend
    command: rq worker --url redis://redis:6379/0 default
    mem_limit: 2g
    pids_limit: 256

  janitor:
    <<: *backend
    command: python -m freerec.janitor

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    environment:
      BACKEND_URL: http://api:8000
    ports: ["3000:3000"]
    depends_on: [api]
