[project]
name = "freerec-backend"
version = "0.1.0"
description = "Job API and workers for server-processed Freerec tools"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35",
    "fastapi>=0.115",
    "pydantic-settings>=2.6",
    "redis>=5.2",
    "rq>=2.0",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "fakeredis>=2.26",
    "httpx2>=0.1",
    "moto[s3]>=5.0",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/freerec"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
