name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web lint
      - run: pnpm --filter web typecheck
      - run: pnpm --filter web test
      - run: pnpm --filter web build
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm --filter web test:e2e
      # The Cloudflare Workers bundle must build too; deploys run it on main.
      - run: pnpm --filter web build:cloudflare
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: apps/web/test-results/
          retention-days: 7

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/backend
    env:
      # The conversion tests must run here; a missing converter fails instead of skipping.
      FREEREC_REQUIRE_TOOLS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install converters
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libreoffice-writer-nogui libreoffice-calc-nogui libreoffice-impress-nogui \
            ghostscript qpdf calibre fonts-liberation2 fonts-crosextra-carlito
      - run: uv sync --locked --extra docs
      - run: uv run playwright install --with-deps --only-shell chromium
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  stack:
    runs-on: ubuntu-latest
    needs: [web, backend]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f infra/docker-compose.yml up --build --detach
      - run: python3 scripts/smoke.py
      # Every server tool through the real UI, against the stack's web container.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm --filter web test:e2e e2e/server-tools.spec.ts
        env:
          E2E_BASE_URL: http://localhost:3000
          E2E_SERVER_TOOLS: "1"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-stack-results
          path: apps/web/test-results/
          retention-days: 7
      - if: failure()
        run: docker compose -f infra/docker-compose.yml logs
      - if: always()
        run: docker compose -f infra/docker-compose.yml down --volumes
